# Construye una vez y publica los artefactos versionados que se despliegan en DES y PROD.
name: Build

on:
  push:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.semVer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GitVersion necesita el historial completo
      - uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: '6.x'
      - id: version
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
      - uses: ./.github/actions/setup
      - run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: changehouse-${{ steps.version.outputs.semVer }}
          path: |
            services/api/dist
            apps/landing/dist
            apps/mobile/dist
          if-no-files-found: error
          retention-days: 30
