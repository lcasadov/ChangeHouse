# Integración continua: la puerta de calidad de cada PR (.claude/harness/profile/quality-gates.md).
# Los nombres de los jobs son los checks requeridos por la protección de rama.
name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint
      - name: El cliente tipado de la app coincide con el contrato
        run: |
          pnpm --filter @changehouse/mobile generate:api
          git diff --exit-code apps/mobile/src/api/schema.d.ts

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Falla si algún paquete queda por debajo del 80 % (umbral configurado en cada paquete)
      - run: pnpm test:coverage
      # Cabeceras de Hosting (CSP) y su generación por entorno
      - run: pnpm test:scripts

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Los emuladores de Firebase (Auth y Firestore) necesitan Java
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      # Testcontainers usa el Docker del runner (PostgreSQL + PostGIS reales) y `firebase emulators:exec`
      # arranca los emuladores de Auth y Firestore para las pruebas (también las de reglas de Firestore) y los apaga
      # al terminar (script raíz test:integration)
      - run: pnpm test:integration

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build

  dependencies:
    name: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Bloquea dependencias de producción con vulnerabilidades críticas
      - run: pnpm audit --prod --audit-level critical
