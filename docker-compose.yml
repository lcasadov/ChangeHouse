# Entorno local: PostgreSQL 17 + PostGIS y Cloud Storage simulado (fake-gcs-server) para las fotos.
# Los emuladores de Firebase se arrancan con `pnpm emulators`.
services:
  db:
    image: postgis/postgis:17-3.5
    container_name: changehouse-db
    environment:
      POSTGRES_DB: changehouse
      POSTGRES_USER: changehouse
      POSTGRES_PASSWORD: changehouse # solo local; en DES y PROD la credencial vive en Secret Manager
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U changehouse -d changehouse']
      interval: 5s
      timeout: 3s
      retries: 10
  # Cloud Storage simulado: originales de las fotos (privado) y fotos procesadas (público).
  # `-public-host` debe coincidir con el host:puerto con el que se accede (el servidor solo atiende las
  # URL firmadas y la lectura pública cuando la cabecera Host es esa). Cada carpeta de `infra/fake-gcs`
  # es un bucket: `changehouse-photos-private` (originales) y `changehouse-photos-public` (procesadas).
  storage:
    image: fsouza/fake-gcs-server:1.56.1
    container_name: changehouse-storage
    command:
      [
        '-scheme',
        'http',
        '-port',
        '4443',
        '-backend',
        'memory',
        '-public-host',
        'localhost:4443',
        '-data',
        '/data',
      ]
    ports:
      - '4443:4443'
    volumes:
      - ./infra/fake-gcs:/data:ro
volumes:
  db-data:
