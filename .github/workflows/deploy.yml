# Despliegue: construye una vez, despliega en DES al integrar en develop y promociona
# la MISMA imagen (por digest) a PROD con aprobación manual (required reviewers en PROD).
# Inactivo mientras el environment no tenga la variable GCP_PROJECT_ID (infra/README.md).
name: Deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      image_digest:
        description: Digest de la imagen ya validada en DES que se promociona a PROD
        required: false

permissions:
  contents: read
  id-token: write # Workload Identity Federation

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  des:
    name: deploy-des
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: DES
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Comprobar configuración del entorno
        id: enabled
        run: |
          if [ -z "${{ vars.GCP_PROJECT_ID }}" ]; then
            echo "DES sin configurar (falta GCP_PROJECT_ID): se omite el despliegue." >> "$GITHUB_STEP_SUMMARY"
            echo "on=false" >> "$GITHUB_OUTPUT"
          else
            echo "on=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.enabled.outputs.on == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.enabled.outputs.on == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - if: steps.enabled.outputs.on == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Construir y publicar la imagen de la API
        if: steps.enabled.outputs.on == 'true'
        id: push
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/changehouse/api"
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build -f services/api/Dockerfile -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:${{ github.sha }}"
          DIGEST="$(gcloud artifacts docker images describe "$IMAGE:${{ github.sha }}" --format='value(image_summary.digest)')"
          echo "digest=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Desplegar la API en Cloud Run
        if: steps.enabled.outputs.on == 'true'
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3
        with:
          service: api
          region: ${{ vars.GCP_REGION }}
          image: ${{ steps.push.outputs.digest }}
          flags: >-
            --service-account=${{ vars.GCP_API_SERVICE_ACCOUNT }}
            --add-cloudsql-instances=${{ vars.CLOUD_SQL_INSTANCE }}
            --min-instances=0 --allow-unauthenticated
      - if: steps.enabled.outputs.on == 'true'
        uses: ./.github/actions/setup
      - name: Construir y publicar landing y app web
        if: steps.enabled.outputs.on == 'true'
        env:
          # Orígenes del entorno que se incorporan a la CSP de Hosting (scripts/hosting-csp.mjs)
          API_ORIGIN: ${{ vars.API_ORIGIN }}
          SENTRY_ORIGIN: ${{ vars.SENTRY_ORIGIN }}
          STORAGE_PUBLIC_ORIGIN: ${{ vars.STORAGE_PUBLIC_ORIGIN }}
        run: |
          pnpm --filter @changehouse/landing --filter @changehouse/mobile build
          node scripts/hosting-csp.mjs
          pnpm exec firebase target:apply hosting landing "${{ vars.GCP_PROJECT_ID }}" --project "${{ vars.GCP_PROJECT_ID }}"
          pnpm exec firebase target:apply hosting app "${{ vars.GCP_PROJECT_ID }}-app" --project "${{ vars.GCP_PROJECT_ID }}"
          pnpm exec firebase deploy --only hosting,firestore:rules,storage --project "${{ vars.GCP_PROJECT_ID }}" --non-interactive

  prod:
    name: deploy-prod
    # Solo desde la rama de producción: el environment PROD también restringe las ramas (infra/README.md)
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.image_digest != '' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: PROD # exige aprobación manual (required reviewers)
    timeout-minutes: 30
    env:
      # Los datos de entrada llegan por entorno, nunca interpolados en `run:`
      IMAGE_DIGEST: ${{ inputs.image_digest }}
    steps:
      - name: Validar la imagen a promocionar
        run: |
          pattern='^europe-southwest1-docker\.pkg\.dev/[a-z0-9-]+/changehouse/api@sha256:[0-9a-f]{64}$'
          if [[ ! "$IMAGE_DIGEST" =~ $pattern ]]; then
            echo "::error::image_digest no es un digest del registro de imágenes de la API"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Copiar la imagen validada en DES al registro de PROD
        run: |
          TARGET="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/changehouse/api:${GITHUB_SHA}"
          gcloud artifacts docker images copy "$IMAGE_DIGEST" "$TARGET" --quiet 2>/dev/null \
            || { docker pull "$IMAGE_DIGEST" && docker tag "$IMAGE_DIGEST" "$TARGET" && docker push "$TARGET"; }
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
      - uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3
        with:
          service: api
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.TARGET }}
          flags: >-
            --service-account=${{ vars.GCP_API_SERVICE_ACCOUNT }}
            --add-cloudsql-instances=${{ vars.CLOUD_SQL_INSTANCE }}
            --min-instances=0 --allow-unauthenticated
      # Las reglas son las del repositorio en la versión que se despliega, igual que en DES
      - uses: ./.github/actions/setup
      - name: Desplegar las reglas de Firestore y Storage
        run: pnpm exec firebase deploy --only firestore:rules,storage --project "${{ vars.GCP_PROJECT_ID }}" --non-interactive
