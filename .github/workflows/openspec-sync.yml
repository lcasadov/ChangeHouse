# Comprueba que PLAN.md y GitHub Issues reflejan el estado de los changes de OpenSpec.
# Es la última red si el hook Stop de Claude Code (.claude/settings.json) estaba desactivado.
name: OpenSpec sync

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openspec-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Comprobar sincronización de OpenSpec
        run: node .claude/hooks/openspec-sync-check.cjs --ci
