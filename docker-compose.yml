# Entorno local: PostgreSQL 17 + PostGIS y Cloud Storage simulado (fake-gcs-server) para las fotos.
# Los emuladores de Firebase se arrancan con `pnpm emulators`.
services:
  db:
    image: postgis/postgis:17-3.5
    container_name: changehouse-db
    environment:
      POSTGRES_DB: changehouse
      POSTGRES_USER: changehouse
      POSTGRES_PASSWORD: changehouse # solo local; en DES y PROD la credencial vive en Secret Manager
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U changehouse -d changehouse']
      interval: 5s
      timeout: 3s
      retries: 10
  # Cloud Storage simulado: originales de las fotos (privado) y fotos procesadas (público).
  # `-public-host` debe coincidir con el host:puerto con el que se accede (el servidor solo atiende las
  # URL firmadas y la lectura pública cuando la cabecera Host es esa). Para probar desde un móvil de la
  # misma Wi-Fi: `FAKE_GCS_PUBLIC_HOST=<IP del PC>:4443`, que escribe `pnpm lan:env` en `.env`.
  # Cada carpeta de `infra/fake-gcs` es un bucket: `changehouse-photos-private` (originales) y
  # `changehouse-photos-public` (procesadas).
  # `-cors-headers` permite la cabecera firmada `x-goog-content-length-range` en la petición previa
  # CORS: sin ella el navegador no puede subir fotos desde la app web (#423).
  storage:
    image: fsouza/fake-gcs-server:1.56.1
    container_name: changehouse-storage
    command:
      [
        '-scheme',
        'http',
        '-port',
        '4443',
        '-backend',
        'memory',
        '-public-host',
        '${FAKE_GCS_PUBLIC_HOST:-localhost:4443}',
        '-data',
        '/data',
        '-cors-headers',
        'x-goog-content-length-range',
      ]
    ports:
      - '4443:4443'
    volumes:
      - ./infra/fake-gcs:/data:ro
volumes:
  db-data:
